services:
  stirling-pdf:
    image: stirling-pdf-local:latest
    build:
      context: ../..
      dockerfile: docker/embedded/Dockerfile
    container_name: stirling-pdf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 5s
      timeout: 10s
      retries: 16
    ports:
      - "8088:8080"
    volumes:
      - ../../stirling/latest/data:/usr/share/tessdata:rw
      - ../../stirling/latest/config:/configs:rw
      - ../../stirling/latest/logs:/logs:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "true"
      SYSTEM_DEFAULTLOCALE: pt-BR
      UI_APPNAME: Stirling-PDF
      UI_HOMEDESCRIPTION: Stirling-PDF Enterprise Custom
      UI_APPNAMENAVBAR: Stirling-PDF
      SYSTEM_MAXFILESIZE: "500"
      METRICS_ENABLED: "true"
      # Conexão com o PostgreSQL separado
      SYSTEM_DATASOURCE_ENABLECUSTOMDATABASE: "true"
      SYSTEM_DATASOURCE_CUSTOMDATABASEURL: "jdbc:postgresql://postgres:5432/stirling_pdf"
      SYSTEM_DATASOURCE_USERNAME: "stirling"
      SYSTEM_DATASOURCE_PASSWORD: "stirling_secret_password"
    networks:
      - stirling-network

  postgres:
    image: postgres:16-alpine
    container_name: stirling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stirling_pdf
      POSTGRES_USER: stirling
      POSTGRES_PASSWORD: stirling_secret_password
    volumes:
      - ../../stirling/latest/postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stirling -d stirling_pdf"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stirling-network

networks:
  stirling-network:
    driver: bridge

volumes:
  stirling-data:
  stirling-config:
  stirling-logs:
  postgres-data:
